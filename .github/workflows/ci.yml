name: API CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:

  build-go:
    name: Build Go Backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Build
      run: |
        cd backend
        go mod tidy
        go build -v ./...
        
    - name: Test
      run: |
        cd backend
        go test -v ./...

  build-frontend:
    name: Build Vue Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        cd webapp
        npm ci
        
    - name: Build
      run: |
        cd webapp
        npm run build

  docker-build:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [build-go, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server:latest-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create and push manifest (latest)
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server:latest \
            ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server:latest-arm64

      - name: Create and push manifest (${{ steps.version.outputs.VERSION }})
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server:${{ steps.version.outputs.VERSION }} \
            ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server:${{ steps.version.outputs.VERSION }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server:${{ steps.version.outputs.VERSION }}-arm64


