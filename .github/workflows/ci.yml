name: API CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:

  build-go:
    name: Build Go Backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Build
      run: |
        cd backend
        go mod tidy
        go build -v ./...
        
    - name: Test
      run: |
        cd backend
        go test -v ./...

  build-frontend:
    name: Build Vue Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        cd webapp
        npm ci
        
    - name: Build
      run: |
        cd webapp
        npm run build

  converter-version:
    name: Resolve converter version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.resolve.outputs.CONVERTER_VERSION }}
    steps:
      - name: Resolve current npm release
        id: resolve
        # Resolved once here (not per matrix leg) so both architecture images
        # embed the same converter even if a release ships mid-build. The
        # value busts the Docker install-layer cache when a new converter
        # ships (see Dockerfile); a failed lookup fails the build instead of
        # writing an empty (cache-stable) value.
        run: |
          CONVERTER_VERSION="$(npm view @aitjcize/epaper-image-convert version)"
          echo "CONVERTER_VERSION=${CONVERTER_VERSION}" >> $GITHUB_OUTPUT

  docker-build:
    name: Build Docker Image (${{ matrix.arch }})
    # Each arch builds on a native runner. The arm64 leg used to build on an
    # amd64 runner through QEMU, where compiling the canvas native module
    # (no musl prebuilds) took an hour+ and qemu-user's multithreading bugs
    # regularly hung node/npm outright.
    runs-on: ${{ matrix.runner }}
    needs: [build-go, build-frontend, converter-version]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            CONVERTER_VERSION=${{ needs.converter-version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server:latest-${{ matrix.arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create and push manifest (latest)
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server:latest-arm64

      - name: Create and push manifest (${{ steps.version.outputs.VERSION }})
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server:${{ steps.version.outputs.VERSION }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server:${{ steps.version.outputs.VERSION }}-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server:${{ steps.version.outputs.VERSION }}-arm64

  update-readme:
    name: Update Docker Hub README
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/esp32-photoframe-server
          short-description: "Image server for ESP32 PhotoFrame: Google Photos, Synology, Telegram & AI generation."
